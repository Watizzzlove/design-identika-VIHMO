<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIHMO — Компьютерная версия (Desktop · 1440px)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #141312;
      color: #FFFFFF;
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: auto;
    }
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      background: rgba(20, 19, 18, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
    }
    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      letter-spacing: 3px;
      text-decoration: none;
      color: #FFFFFF;
    }
    .badge {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #A09D96;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 12px;
      border-radius: 4px;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn {
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 4px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-active {
      background: #FFFFFF;
      color: #141312;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #E2DFD8;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.18);
    }
    .mockup-container {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      line-height: 0;
    }
    .mockup-img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <header class="top-nav">
    <a href="index.html" class="brand">VIHMO</a>
    <span class="badge">Компьютерная версия · 1440 px</span>
    <nav class="nav-links">
      <a href="desktop.html" class="btn btn-active">💻 Компьютерная</a>
      <a href="mobile.html" class="btn btn-secondary">📱 Мобильная</a>
      <a href="desktop.png" target="_blank" download class="btn btn-secondary">⬇ Скачать оригинал</a>
    </nav>
  </header>
  <main class="mockup-container">
    <img src="desktop.png?v=3" alt="VIHMO — Компьютерная версия сайта" class="mockup-img" width="1440" height="6756">
  </main>
</body>
</html>
